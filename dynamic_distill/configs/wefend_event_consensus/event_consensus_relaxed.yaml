model:
  num_classes: 2
  encoder_dim: 768
  classifier_hidden: 512
  dropout: 0.1
  text_model: bert-base-chinese
  vision_model: google/vit-base-patch16-224-in21k
optim:
  lr: 1.55e-05
  weight_decay: 0.01
loss:
  alpha: 0.6
  beta: 0.32
  gamma: 1.2
  evidence_anneal_steps: 2000
  class_weights:
  - 0.635
  - 2.4597
  event_reweight:
    enabled: true
    warmup_steps: 4
    min_size: 3
    scale: 0.35
    power: 1.15
    focus_positive: true
    clip: 2.0
distillation:
  temperature: 2.0
  delta: 0.045
  lambda_kl: 0.85
  lambda_feat: 0.08
  warmup_steps: 240
  start_fraction: 0.18
  end_fraction: 0.85
  adaptive_temperature:
    enabled: true
    base: 2.32
    coeff: 1.08
  confidence_gate:
    enabled: true
    margin: 0.12
  uncertainty_ema:
    enabled: true
    momentum: 0.9
  lambda_fusion_to_text: 0.14
  lambda_fusion_to_vision: 0.14
  fusion_confidence: 0.12
  require_student_mistake: false
  agreement_confidence_gap: 0.015
  positive_distill_boost: 1.72
  positive_student_conf_margin: 0.88
  positive_stage_start_fraction: 0.44
  positive_stage_boost: 2.32
  positive_stage_conf_margin: 0.95
  positive_event_gate:
    enabled: true
    min_size: 2
    teacher_conf: 0.9
    student_conf: 0.78
    only: false
  event_filter:
    min_size: 2
    teacher_min_acc: 0.78
    teacher_min_conf: 0.85
    warmup_steps: 3
  fusion_teacher_must_match: false
  delta_schedule:
    end_fraction: 0.9
  event_layer:
    enabled: true
    metric: avg
    min_seen: 6
    high_threshold: 0.93
    mid_threshold: 0.86
    weight_high: 1.05
    weight_mid: 0.78
    weight_low: 0.5
    default_weight: 0.9
  weak_teacher:
    enabled: true
    lambda: 0.2
    metric: avg
    min_seen: 5
    threshold: 0.8
    apply_positive: true
    apply_negative: false
    temperature: 2.0
    use_ema: true
    mix_ratio: 0.6
    event_ema_enabled: true
    event_ema_decay: 0.65
    event_mix: 0.5
  consistency:
    enabled: true
    lambda: 0.15
    metric: min
    min_seen: 4
    max_score: 0.9
    apply_positive: true
    default_score: 0.9
  soft_quota:
    enabled: false
  uncertainty_weight: {}
training:
  epochs: 20
  batch_size: 32
  log_every: 50
  max_steps_per_epoch: 260
  allow_data_parallel: true
  early_stopping_patience: 8
scheduler:
  type: cosine
  warmup_steps: 720
teacher:
  use_ema: true
  ema_decay: 0.998
  teacher_config: dynamic_distill/configs/wefend_uncertainty_fusion_v2.yaml
  teacher_checkpoint: paper_results/wefend_uncertainty_fusion_v2/wefend_uncertainty_fusion_v2_seed00/model_best.pt
logging:
  output_dir: paper_results/wefend_dynamic_distill_teacher_wcls_selective_v2
  run_name: event_consensus_relaxed
  overwrite: true
tokenizer:
  name: bert-base-chinese
  max_length: 160
  local_files_only: false
  word_dropout: 0.1
vision_processor:
  name: google/vit-base-patch16-224-in21k
  image_size: 224
  local_files_only: false
  augment:
    enabled: true
    flip_prob: 0.5
    color_jitter: 0.2
    random_rescale: 0.1
data:
  type: wefend
  root: datasets/wechat
  num_workers: 8
  pin_memory: true
  train:
    csv_file: processed_split/wefend_train.csv
    image_dir: images
  val:
    csv_file: processed_split/wefend_val.csv
    image_dir: images
  test:
    csv_file: processed_split/wefend_test.csv
    image_dir: images
notes:
  strategy_name: event_consensus_relaxed
