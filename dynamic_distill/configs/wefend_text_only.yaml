model:
  num_classes: 2
  encoder_dim: 768
  classifier_hidden: 512
  dropout: 0.1
  text_model: bert-base-chinese
  vision_model: null

optim:
  lr: 0.000022
  weight_decay: 0.01

loss:
  alpha: 1.0
  beta: 0.0
  gamma: 0.0
  evidence_anneal_steps: 0
  class_weights: [0.7, 2.0]

distillation:
  disable: true

training:
  epochs: 8
  batch_size: 32
  log_every: 100
  max_steps_per_epoch: 400
  allow_data_parallel: true
  early_stopping_patience: 2

scheduler:
  type: cosine
  warmup_steps: 300

teacher:
  use_ema: false

logging:
  output_dir: paper_results/wefend_text_only
  run_name: wefend_text_only
  overwrite: true

tokenizer:
  name: bert-base-chinese
  max_length: 160
  local_files_only: false
  word_dropout: 0.0

vision_processor:
  name: google/vit-base-patch16-224-in21k
  image_size: 224
  local_files_only: false
  augment:
    enabled: false

data:
  type: wefend
  root: datasets/wechat
  num_workers: 4
  pin_memory: true
  train:
    csv_file: processed_split/wefend_train.csv
    image_dir: images
  val:
    csv_file: processed_split/wefend_val.csv
    image_dir: images
  test:
    csv_file: processed_split/wefend_test.csv
    image_dir: images
notes:
  description: text-only BERT baseline for WeFEND
