model:
  num_classes: 2
  encoder_dim: 1024
  classifier_hidden: 768
  dropout: 0.2
  text_model: roberta-large
  vision_model: google/vit-base-patch16-224-in21k

optim:
  lr: 2.0e-05
  weight_decay: 0.01

loss:
  alpha: 0.5
  beta: 0.3
  gamma: 0.0
  evidence_anneal_steps: 300

distillation:
  temperature: 2.0
  delta: 0.05
  lambda_kl: 0.0
  lambda_feat: 0.0
  warmup_steps: 0
  start_fraction: 0.0
  adaptive_temperature:
    enabled: false
  confidence_gate:
    enabled: false
  uncertainty_ema:
    enabled: false

training:
  epochs: 6
  batch_size: 16
  log_every: 25
  max_steps_per_epoch: 160
  allow_data_parallel: true

tokenizer:
  name: roberta-large
  max_length: 160
  local_files_only: false

vision_processor:
  name: google/vit-base-patch16-224-in21k
  image_size: 224
  local_files_only: false

scheduler:
  type: cosine
  warmup_steps: 200

teacher:
  use_ema: false
  ema_decay: 0.999

logging:
  output_dir: paper_results/twitter_official_clean
  run_name: twitter_roberta_sanity
  overwrite: true

data:
  type: twitter
  root: datasets/twitter
  num_workers: 4
  pin_memory: true
  train:
    csv_file: twitter/train_posts_clean.csv
    image_dir: twitter/images_train
    val_fraction: 0.125
    seed: 42
    limit: 2048
  val:
    csv_file: twitter/train_posts_clean.csv
    image_dir: twitter/images_train
    val_fraction: 0.125
    seed: 42
    limit: 512
  test:
    csv_file: twitter/test_posts.csv
    image_dir: twitter/images_test
    val_fraction: 0.0
    limit: 512
