model:
  num_classes: 2
  encoder_dim: 768
  classifier_hidden: 512
  dropout: 0.1
  text_model: null
  vision_model: google/vit-base-patch16-224-in21k

optim:
  lr: 0.000015
  weight_decay: 0.01

loss:
  alpha: 0.0
  beta: 1.0
  gamma: 0.0
  evidence_anneal_steps: 0
  class_weights: [1.0, 1.0]

distillation:
  disable: true

training:
  epochs: 8
  batch_size: 24
  log_every: 100
  max_steps_per_epoch: 1200
  allow_data_parallel: true
  early_stopping_patience: 2

scheduler:
  type: cosine
  warmup_steps: 400

teacher:
  use_ema: false

logging:
  output_dir: paper_results/wefend_image_only
  run_name: wefend_image_only
  overwrite: true

tokenizer:
  name: bert-base-chinese
  max_length: 160
  local_files_only: false

vision_processor:
  name: google/vit-base-patch16-224-in21k
  image_size: 224
  local_files_only: false
  augment:
    enabled: true
    flip_prob: 0.5
    color_jitter: 0.2
    random_rescale: 0.1

data:
  type: wefend
  root: datasets/wechat
  num_workers: 8
  pin_memory: true
  train:
    csv_file: processed_split/wefend_train.csv
    image_dir: images
  val:
    csv_file: processed_split/wefend_val.csv
    image_dir: images
  test:
    csv_file: processed_split/wefend_test.csv
    image_dir: images

notes:
  description: image-only ViT baseline for WeFEND
