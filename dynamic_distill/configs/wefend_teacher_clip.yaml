model:
  num_classes: 2
  encoder_dim: 1024
  classifier_hidden: 512
  dropout: 0.1
  text_model: openai/clip-vit-large-patch14-336
  vision_model: openai/clip-vit-large-patch14-336

optim:
  lr: 2.0e-05
  weight_decay: 0.01

loss:
  alpha: 0.5
  beta: 0.3
  gamma: 0.0
  evidence_anneal_steps: 1500

training:
  epochs: 12
  batch_size: 6
  log_every: 50
  max_steps_per_epoch: null
  allow_data_parallel: true

scheduler:
  type: cosine
  warmup_steps: 800

teacher:
  use_ema: true
  ema_decay: 0.998

logging:
  output_dir: paper_results/wefend_teacher_clip
  run_name: wefend_teacher_clip
  overwrite: true

tokenizer:
  name: openai/clip-vit-large-patch14-336
  max_length: 160
  local_files_only: false

vision_processor:
  name: openai/clip-vit-large-patch14-336
  image_size: 336
  local_files_only: false
  augment:
    enabled: true
    flip_prob: 0.5
    color_jitter: 0.1
    random_rescale: 0.1

data:
  type: wefend
  root: datasets/wechat
  num_workers: 8
  pin_memory: true
  train:
    csv_file: processed_split/wefend_train.csv
    image_dir: images
  val:
    csv_file: processed_split/wefend_val.csv
    image_dir: images
  test:
    csv_file: processed_split/wefend_test.csv
    image_dir: images
