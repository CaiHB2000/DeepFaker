model:
  num_classes: 2
  encoder_dim: 768
  classifier_hidden: 512
  dropout: 0.1
  text_model: hfl/chinese-roberta-wwm-ext-large
  vision_model: google/vit-large-patch16-224-in21k

optim:
  lr: 1.75e-05
  weight_decay: 0.01

loss:
  alpha: 0.62
  beta: 0.33
  gamma: 0.0
  evidence_anneal_steps: 2000
  class_weights:
    - 0.635
    - 2.3597

training:
  epochs: 12
  batch_size: 32
  log_every: 50
  max_steps_per_epoch: 360
  allow_data_parallel: true
  early_stopping_patience: 5

scheduler:
  type: cosine
  warmup_steps: 780

logging:
  output_dir: paper_results/wefend_teacher_vitlarge
  run_name: wefend_teacher_vitlarge
  overwrite: true

tokenizer:
  name: hfl/chinese-roberta-wwm-ext-large
  max_length: 160
  local_files_only: false
  word_dropout: 0.1

vision_processor:
  name: google/vit-large-patch16-224-in21k
  image_size: 224
  local_files_only: false
  augment:
    enabled: true
    flip_prob: 0.5
    color_jitter: 0.2
    random_rescale: 0.1

data:
  type: wefend
  root: datasets/wechat
  num_workers: 8
  pin_memory: true
  train:
    csv_file: processed_split/wefend_train.csv
    image_dir: images
  val:
    csv_file: processed_split/wefend_val.csv
    image_dir: images
  test:
    csv_file: processed_split/wefend_test.csv
    image_dir: images
