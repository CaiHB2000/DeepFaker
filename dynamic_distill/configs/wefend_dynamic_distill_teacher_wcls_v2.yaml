model:
  num_classes: 2
  encoder_dim: 768
  classifier_hidden: 512
  dropout: 0.1
  text_model: bert-base-chinese
  vision_model: google/vit-base-patch16-224-in21k

optim:
  lr: 1.75e-05
  weight_decay: 0.01

loss:
  alpha: 0.6
  beta: 0.32
  gamma: 1.1
  evidence_anneal_steps: 1800
  class_weights:
    - 0.635
    - 2.3597

distillation:
  temperature: 2.6
  delta: 0.06
  lambda_kl: 1.0
  lambda_feat: 0.1
  warmup_steps: 520
  start_fraction: 0.35
  adaptive_temperature:
    enabled: true
    base: 2.5
    coeff: 1.2
  confidence_gate:
    enabled: true
    margin: 0.18
  uncertainty_ema:
    enabled: true
    momentum: 0.92
  lambda_fusion_to_text: 0.12
  lambda_fusion_to_vision: 0.12
  fusion_confidence: 0.08

training:
  epochs: 18
  batch_size: 32
  log_every: 50
  max_steps_per_epoch: 360
  allow_data_parallel: true
  early_stopping_patience: 6

tokenizer:
  name: bert-base-chinese
  max_length: 160
  local_files_only: false
  word_dropout: 0.1

vision_processor:
  name: google/vit-base-patch16-224-in21k
  image_size: 224
  local_files_only: false
  augment:
    enabled: true
    flip_prob: 0.5
    color_jitter: 0.25
    random_rescale: 0.12

scheduler:
  type: cosine
  warmup_steps: 780

teacher:
  use_ema: true
  ema_decay: 0.998
  teacher_config: dynamic_distill/configs/wefend_uncertainty_fusion.yaml
  teacher_checkpoint: paper_results/wefend/wefend_uncertainty_fusion_wcls_seed01/model_best.pt

logging:
  output_dir: paper_results/wefend_dynamic_distill_teacher_wcls_v2
  run_name: wefend_dynamic_distill_teacher_wcls_v2
  overwrite: true

data:
  type: wefend
  root: datasets/wechat
  num_workers: 8
  pin_memory: true
  train:
    csv_file: processed_split/wefend_train.csv
    image_dir: images
  val:
    csv_file: processed_split/wefend_val.csv
    image_dir: images
  test:
    csv_file: processed_split/wefend_test.csv
    image_dir: images
