model:
  num_classes: 2
  encoder_dim: 768
  classifier_hidden: 512
  dropout: 0.1
  text_model: bert-base-chinese
  vision_model: google/vit-base-patch16-224-in21k
optim:
  lr: 1.55e-05
  weight_decay: 0.01
loss:
  alpha: 0.6
  beta: 0.32
  gamma: 1.2
  evidence_anneal_steps: 2000
  class_weights:
  - 0.635
  - 2.9
distillation:
  temperature: 2.32
  delta: 0.065
  lambda_kl: 1.05
  lambda_feat: 0.1
  warmup_steps: 320
  start_fraction: 0.22
  end_fraction: 0.72
  adaptive_temperature:
    enabled: true
    base: 2.32
    coeff: 1.08
  confidence_gate:
    enabled: true
    margin: 0.19
  uncertainty_ema:
    enabled: true
    momentum: 0.9
  lambda_fusion_to_text: 0.12
  lambda_fusion_to_vision: 0.12
  fusion_confidence: 0.16
  require_student_mistake: true
  agreement_confidence_gap: 0.03
  positive_distill_boost: 1.72
  positive_student_conf_margin: 0.88
  positive_stage_start_fraction: 0.44
  positive_stage_boost: 2.32
  positive_stage_conf_margin: 0.95
  positive_event_gate:
    enabled: true
    min_size: 2
    teacher_conf: 0.955
    student_conf: 0.84
    only: false
  event_filter:
    min_size: 2
    teacher_min_acc: 0.9
    teacher_min_conf: 0.92
    warmup_steps: 5
  fusion_teacher_must_match: true
  delta_schedule:
    end_fraction: 0.74
  event_layer:
    enabled: true
    metric: min
    min_seen: 6
    high_threshold: 0.935
    mid_threshold: 0.885
    weight_high: 1.07
    weight_mid: 0.75
    weight_low: 0.46
  weak_teacher:
    enabled: true
    lambda: 0.22
    metric: avg
    min_seen: 5
    threshold: 0.86
    apply_positive: true
    apply_negative: false
    temperature: 2.18
    use_ema: true
    mix_ratio: 0.55
    event_ema_enabled: true
    event_ema_decay: 0.7
    event_mix: 0.66
  consistency:
    enabled: true
    lambda: 0.12
    metric: min
    min_seen: 4
    max_score: 0.85
    apply_positive: true
    default_score: 0.9
  soft_quota:
    enabled: true
    min_frac: 0.03
    max_frac: 0.07
    per_event_cap_frac: 0.12
  event_calibration:
    enabled: false
  uncertainty_weight:
    enabled: false
training:
  epochs: 20
  batch_size: 32
  log_every: 50
  max_steps_per_epoch: 240
  allow_data_parallel: true
  early_stopping_patience: 8
scheduler:
  type: cosine
  warmup_steps: 720
teacher:
  use_ema: true
  ema_decay: 0.998
  teacher_config: dynamic_distill/configs/wefend_uncertainty_fusion_v2.yaml
  teacher_checkpoint: paper_results/wefend_uncertainty_fusion_v2/wefend_uncertainty_fusion_v2_seed00/model_best.pt
logging:
  output_dir: paper_results/wefend_dynamic_distill_teacher_wcls_selective_v2
  run_name: event_consensus_lambda_high
  overwrite: true
tokenizer:
  name: bert-base-chinese
  max_length: 160
  local_files_only: false
  word_dropout: 0.1
vision_processor:
  name: google/vit-base-patch16-224-in21k
  image_size: 224
  local_files_only: false
  augment:
    enabled: true
    flip_prob: 0.5
    color_jitter: 0.2
    random_rescale: 0.1
data:
  type: wefend
  root: datasets/wechat
  num_workers: 8
  pin_memory: true
  train:
    csv_file: processed_split/wefend_train.csv
    image_dir: images
  val:
    csv_file: processed_split/wefend_val.csv
    image_dir: images
  test:
    csv_file: processed_split/wefend_test.csv
    image_dir: images
notes:
  strategy_name: event_consensus_lambda_high
