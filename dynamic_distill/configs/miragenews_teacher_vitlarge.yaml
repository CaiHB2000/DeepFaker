model:
  num_classes: 2
  encoder_dim: 768
  classifier_hidden: 512
  dropout: 0.1
  text_model: roberta-large
  vision_model: google/vit-large-patch16-224-in21k

optim:
  lr: 1.2e-05
  weight_decay: 0.01

loss:
  alpha: 0.6
  beta: 0.32
  gamma: 0.0   # teacher only
  evidence_anneal_steps: 400
  class_weights: [1.0, 1.0]

training:
  epochs: 6
  batch_size: 24
  log_every: 200
  max_steps_per_epoch: 1200
  allow_data_parallel: true
  early_stopping_patience: 2

scheduler:
  type: cosine
  warmup_steps: 400

logging:
  output_dir: paper_results/miragenews_teacher_vitlarge
  run_name: miragenews_teacher_vitlarge
  overwrite: true

tokenizer:
  name: roberta-large
  max_length: 160
  local_files_only: false

vision_processor:
  name: google/vit-large-patch16-224-in21k
  image_size: 224
  local_files_only: false
  augment:
    enabled: true
    flip_prob: 0.5
    color_jitter: 0.15
    random_rescale: 0.1

data:
  type: generic
  root: datasets/miragenews/processed
  num_workers: 4
  pin_memory: true
  train:
    csv_file: miragenews_train.csv
    image_dir: .
  val:
    csv_file: miragenews_validation.csv
    image_dir: .
  test:
    csv_file: miragenews_test1_nyt_mj.csv
    image_dir: .
