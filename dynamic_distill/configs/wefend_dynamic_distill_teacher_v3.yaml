model:
  num_classes: 2
  encoder_dim: 768
  classifier_hidden: 512
  dropout: 0.1
  text_model: bert-base-chinese
  vision_model: google/vit-base-patch16-224-in21k

optim:
  lr: 1.8e-05
  weight_decay: 0.01

loss:
  alpha: 0.6
  beta: 0.35
  gamma: 1.35
  evidence_anneal_steps: 2000
  class_weights:
    - 0.635
    - 2.3597

distillation:
  temperature: 2.8
  delta: 0.06
  lambda_kl: 1.4
  lambda_feat: 0.22
  warmup_steps: 400
  start_fraction: 0.2
  adaptive_temperature:
    enabled: true
    base: 2.6
    coeff: 1.5
  confidence_gate:
    enabled: true
    margin: 0.15
  uncertainty_ema:
    enabled: true
    momentum: 0.92
  lambda_fusion_to_text: 0.12
  lambda_fusion_to_vision: 0.12
  fusion_confidence: 0.12

training:
  epochs: 18
  batch_size: 32
  log_every: 50
  max_steps_per_epoch: 320
  allow_data_parallel: true
  early_stopping_patience: 6

tokenizer:
  name: bert-base-chinese
  max_length: 160
  local_files_only: false
  word_dropout: 0.1

vision_processor:
  name: google/vit-base-patch16-224-in21k
  image_size: 224
  local_files_only: false
  augment:
    enabled: true
    flip_prob: 0.5
    color_jitter: 0.25
    random_rescale: 0.15

scheduler:
  type: cosine
  warmup_steps: 700

teacher:
  use_ema: true
  ema_decay: 0.998
  teacher_config: dynamic_distill/configs/wefend_uncertainty_fusion.yaml
  teacher_checkpoint: paper_results/wefend/wefend_uncertainty_fusion_seed01/model_best.pt

logging:
  output_dir: paper_results/wefend_dynamic_distill_teacher_v3
  run_name: wefend_dynamic_distill_teacher_v3
  overwrite: true

data:
  type: wefend
  root: datasets/wechat
  num_workers: 8
  pin_memory: true
  train:
    csv_file: processed_split/wefend_train.csv
    image_dir: images
  val:
    csv_file: processed_split/wefend_val.csv
    image_dir: images
  test:
    csv_file: processed_split/wefend_test.csv
    image_dir: images
