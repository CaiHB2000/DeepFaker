model:
  num_classes: 2
  encoder_dim: 1024
  classifier_hidden: 768
  dropout: 0.1
  text_model: microsoft/deberta-v3-large
  vision_model: google/siglip-so400m-patch14-384

optim:
  lr: 1.75e-05
  weight_decay: 0.01

loss:
  alpha: 0.62
  beta: 0.33
  gamma: 0.0
  evidence_anneal_steps: 2000
  class_weights:
    - 0.635
    - 2.3597

training:
  epochs: 12
  batch_size: 12
  log_every: 50
  max_steps_per_epoch: 360
  allow_data_parallel: true
  early_stopping_patience: 5

scheduler:
  type: cosine
  warmup_steps: 780

logging:
  output_dir: paper_results/wefend_teacher_siglip_deb
  run_name: wefend_teacher_siglip_deb
  overwrite: true

tokenizer:
  name: microsoft/deberta-v3-large
  max_length: 160
  local_files_only: false
  word_dropout: 0.1

vision_processor:
  name: google/siglip-so400m-patch14-384
  image_size: 384
  local_files_only: false
  augment:
    enabled: true
    flip_prob: 0.5
    color_jitter: 0.2
    random_rescale: 0.1

data:
  type: wefend
  root: datasets/wechat
  num_workers: 8
  pin_memory: true
  train:
    csv_file: processed_split/wefend_train.csv
    image_dir: images
  val:
    csv_file: processed_split/wefend_val.csv
    image_dir: images
  test:
    csv_file: processed_split/wefend_test.csv
    image_dir: images
