model:
  num_classes: 2
  encoder_dim: 768
  hidden_dim: 512
  dropout: 0.1
  text_model: bert-base-chinese
  vision_model: google/vit-base-patch16-224-in21k

optim:
  lr: 2.0e-05
  weight_decay: 0.01

training:
  epochs: 15
  batch_size: 24
  log_every: 100
  allow_data_parallel: true
  early_stopping_patience: 3

scheduler:
  type: cosine
  warmup_steps: 600

logging:
  output_dir: paper_results/weibo_safe
  run_name: weibo_safe
  overwrite: true

tokenizer:
  name: bert-base-chinese
  max_length: 160
  local_files_only: false

vision_processor:
  name: google/vit-base-patch16-224-in21k
  image_size: 224
  local_files_only: false

data:
  type: weibo
  root: datasets/weibo
  num_workers: 8
  pin_memory: true
  train:
    id_file: train_id.pickle
    text_sources:
      - path: tweets/train_rumor.txt
        label: 1
      - path: tweets/train_nonrumor.txt
        label: 0
      - path: tweets/test_rumor.txt
        label: 1
      - path: tweets/test_nonrumor.txt
        label: 0
  val:
    id_file: validate_id.pickle
    text_sources:
      - path: tweets/train_rumor.txt
        label: 1
      - path: tweets/train_nonrumor.txt
        label: 0
      - path: tweets/test_rumor.txt
        label: 1
      - path: tweets/test_nonrumor.txt
        label: 0
  test:
    id_file: test_id.pickle
    text_sources:
      - path: tweets/test_rumor.txt
        label: 1
      - path: tweets/test_nonrumor.txt
        label: 0
      - path: tweets/train_rumor.txt
        label: 1
      - path: tweets/train_nonrumor.txt
        label: 0
