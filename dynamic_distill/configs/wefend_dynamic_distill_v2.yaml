model:
  num_classes: 2
  encoder_dim: 768
  classifier_hidden: 512
  dropout: 0.1
  text_model: bert-base-chinese
  vision_model: google/vit-base-patch16-224-in21k

optim:
  lr: 2.0e-05
  weight_decay: 0.01

loss:
  alpha: 0.5
  beta: 0.3
  gamma: 1.0
  evidence_anneal_steps: 400

distillation:
  temperature: 3.0
  delta: 0.1
  lambda_kl: 1.0
  lambda_feat: 0.05
  warmup_steps: 400
  start_fraction: 0.45
  adaptive_temperature:
    enabled: true
    base: 3.0
    coeff: 1.0
  confidence_gate:
    enabled: true
    margin: 0.25
  uncertainty_ema:
    enabled: true
    momentum: 0.95
  lambda_fusion_to_text: 0.0
  lambda_fusion_to_vision: 0.0

training:
  epochs: 10
  batch_size: 32
  log_every: 50
  allow_data_parallel: true
  early_stopping_patience: 4

tokenizer:
  name: bert-base-chinese
  max_length: 160
  local_files_only: false

vision_processor:
  name: google/vit-base-patch16-224-in21k
  image_size: 224
  local_files_only: false

scheduler:
  type: cosine
  warmup_steps: 400

teacher:
  use_ema: true
  ema_decay: 0.998

logging:
  output_dir: paper_results/wefend
  run_name: wefend_dynamic_distill_v2
  overwrite: true

data:
  type: wefend
  root: datasets/wechat
  num_workers: 8
  pin_memory: true
  train:
    csv_file: processed_split/wefend_train.csv
    image_dir: images
  val:
    csv_file: processed_split/wefend_val.csv
    image_dir: images
  test:
    csv_file: processed_split/wefend_test.csv
    image_dir: images
