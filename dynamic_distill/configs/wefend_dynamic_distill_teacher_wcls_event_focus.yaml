model:
  num_classes: 2
  encoder_dim: 768
  classifier_hidden: 512
  dropout: 0.1
  text_model: bert-base-chinese
  vision_model: google/vit-base-patch16-224-in21k

optim:
  lr: 1.66e-05
  weight_decay: 0.01

loss:
  alpha: 0.58
  beta: 0.32
  gamma: 1.25
  evidence_anneal_steps: 2400
  class_weights:
    - 0.635
    - 2.3597

distillation:
  temperature: 2.2
  delta: 0.05
  lambda_kl: 1.2
  lambda_feat: 0.08
  warmup_steps: 300
  start_fraction: 0.24
  end_fraction: 0.62
  adaptive_temperature:
    enabled: true
    base: 2.2
    coeff: 1.6
  confidence_gate:
    enabled: true
    margin: 0.15
  uncertainty_ema:
    enabled: true
    momentum: 0.9
  lambda_fusion_to_text: 0.1
  lambda_fusion_to_vision: 0.1
  fusion_confidence: 0.15
  require_student_mistake: false
  agreement_confidence_gap: 0.02
  positive_distill_boost: 1.3
  positive_student_conf_margin: 0.9
  positive_stage_start_fraction: 0.5
  positive_stage_boost: 1.75
  positive_stage_conf_margin: 0.96
  positive_event_gate:
    enabled: true
    min_size: 2
    teacher_conf: 0.98
    student_conf: 0.9
    only: true
  event_filter:
    min_size: 2
    teacher_min_acc: 0.88
    teacher_min_conf: 0.9
    warmup_steps: 4

training:
  epochs: 16
  batch_size: 32
  log_every: 50
  max_steps_per_epoch: 240
  allow_data_parallel: true
  early_stopping_patience: 5

scheduler:
  type: cosine
  warmup_steps: 700

teacher:
  use_ema: true
  ema_decay: 0.998
  teacher_config: dynamic_distill/configs/wefend_uncertainty_fusion_v2.yaml
  teacher_checkpoint: paper_results/wefend_uncertainty_fusion_v2/wefend_uncertainty_fusion_v2_seed00/model_best.pt

logging:
  output_dir: paper_results/wefend_dynamic_distill_teacher_wcls_selective_v2
  run_name: wefend_dynamic_distill_teacher_wcls_event_focus
  overwrite: true

tokenizer:
  name: bert-base-chinese
  max_length: 160
  local_files_only: false
  word_dropout: 0.08

vision_processor:
  name: google/vit-base-patch16-224-in21k
  image_size: 224
  local_files_only: false
  augment:
    enabled: true
    flip_prob: 0.45
    color_jitter: 0.18
    random_rescale: 0.08

data:
  type: wefend
  root: datasets/wechat
  num_workers: 8
  pin_memory: true
  train:
    csv_file: processed_split/wefend_train.csv
    image_dir: images
  val:
    csv_file: processed_split/wefend_val.csv
    image_dir: images
  test:
    csv_file: processed_split/wefend_test.csv
    image_dir: images
