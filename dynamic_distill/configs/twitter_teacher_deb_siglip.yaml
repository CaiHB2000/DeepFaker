model:
  num_classes: 2
  encoder_dim: 768
  classifier_hidden: 512
  dropout: 0.2
  text_model: microsoft/deberta-v3-large
  vision_model: google/siglip-base-patch16-224

optim:
  lr: 1.5e-05
  weight_decay: 0.01

loss:
  alpha: 0.5
  beta: 0.3
  gamma: 0.0   # teacher only
  evidence_anneal_steps: 400

training:
  epochs: 45
  batch_size: 32
  log_every: 50
  max_steps_per_epoch: null
  allow_data_parallel: true
  early_stopping_patience: 6

scheduler:
  type: reduce_on_plateau
  mode: max
  factor: 0.5
  patience: 2
  threshold: 0.0005
  cooldown: 0
  min_lr: 2.0e-06

teacher:
  use_ema: false
  ema_decay: 0.999

logging:
  output_dir: paper_results/twitter_teacher_deb_siglip
  run_name: twitter_teacher_deb_siglip
  overwrite: true

tokenizer:
  name: microsoft/deberta-v3-large
  max_length: 160
  local_files_only: false

vision_processor:
  name: google/siglip-base-patch16-224
  image_size: 224
  local_files_only: false

data:
  type: twitter
  root: datasets/twitter
  num_workers: 8
  pin_memory: true
  train:
    csv_file: twitter/train_posts_clean.csv
    image_dir: twitter/images_train
    val_fraction: 0.125
    seed: 42
  val:
    csv_file: twitter/train_posts_clean.csv
    image_dir: twitter/images_train
    val_fraction: 0.125
    seed: 42
  test:
    csv_file: twitter/test_posts.csv
    image_dir: twitter/images_test
    val_fraction: 0.0
