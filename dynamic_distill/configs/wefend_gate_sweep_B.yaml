model:
  num_classes: 2
  encoder_dim: 768
  classifier_hidden: 512
  dropout: 0.1
  text_model: bert-base-chinese
  vision_model: google/vit-base-patch16-224-in21k

optim:
  lr: 1.75e-05
  weight_decay: 0.01

loss:
  alpha: 0.62
  beta: 0.33
  gamma: 1.15
  evidence_anneal_steps: 2000
  class_weights:
    - 0.635
    - 2.3597

distillation:
  temperature: 2.4
  delta: 0.10
  lambda_kl: 1.1
  lambda_feat: 0.16
  warmup_steps: 480
  start_fraction: 0.32
  adaptive_temperature:
    enabled: true
    base: 2.4
    coeff: 1.3
  confidence_gate:
    enabled: true
    margin: 0.85          # tau_m
  uncertainty_ema:
    enabled: true
    momentum: 0.92
  lambda_fusion_to_text: 0.13
  lambda_fusion_to_vision: 0.13
  fusion_confidence: 0.90  # tau_f

training:
  epochs: 18
  batch_size: 32
  log_every: 50
  max_steps_per_epoch: 360
  allow_data_parallel: true
  early_stopping_patience: 7

tokenizer:
  name: bert-base-chinese
  max_length: 160
  local_files_only: false
  word_dropout: 0.1

vision_processor:
  name: google/vit-base-patch16-224-in21k
  image_size: 224
  local_files_only: false
  augment:
    enabled: true
    flip_prob: 0.5
    color_jitter: 0.2
    random_rescale: 0.1

scheduler:
  type: cosine
  warmup_steps: 780

teacher:
  use_ema: true
  ema_decay: 0.998
  teacher_config: dynamic_distill/configs/wefend_uncertainty_fusion_v2.yaml
  teacher_checkpoint: paper_results/wefend_uncertainty_fusion_v2/wefend_uncertainty_fusion_v2_seed00/model_best.pt

logging:
  output_dir: paper_results/wefend_gate_sweep_B_seed00
  run_name: wefend_gate_sweep_B_seed00
  overwrite: true

data:
  type: wefend
  root: datasets/wechat
  num_workers: 8
  pin_memory: true
  train:
    csv_file: processed_split/wefend_train.csv
    image_dir: images
  val:
    csv_file: processed_split/wefend_val.csv
    image_dir: images
  test:
    csv_file: processed_split/wefend_test.csv
    image_dir: images

notes:
  description: gate sweep point B (tau_f=0.90, tau_m=0.85, delta=0.10)
