model:
  num_classes: 2
  encoder_dim: 768
  classifier_hidden: 512
  dropout: 0.1
  text_model: bert-base-chinese
  vision_model: google/vit-base-patch16-224-in21k

optim:
  lr: 2.0e-05
  weight_decay: 0.01

loss:
  alpha: 0.5
  beta: 0.3
  gamma: 1.0
  evidence_anneal_steps: 1500

# Force-distill variant: loosen gates, enable soft-quota + force masks
# to ensure distillation pairs throughout training.
distillation:
  temperature: 2.1
  delta: 0.03
  lambda_kl: 1.0
  lambda_feat: 0.1
  warmup_steps: 300
  start_fraction: 0.08
  end_fraction: 0.82
  adaptive_temperature:
    enabled: true
    base: 2.1
    coeff: 0.2
  confidence_gate:
    enabled: false
    margin: 0.0
  uncertainty_ema:
    enabled: true
    momentum: 0.9
  lambda_fusion_to_text: 0.12
  lambda_fusion_to_vision: 0.12
  fusion_confidence: 0.08
  require_student_mistake: false
  agreement_confidence_gap: 0.01
  positive_event_gate:
    enabled: false
    min_size: 1
    teacher_conf: 0.65
    student_conf: 0.5
    only: false
  event_filter:
    min_size: 1
    teacher_min_acc: 0.5
    teacher_min_conf: 0.6
    warmup_steps: 2
  fusion_teacher_must_match: false
  delta_schedule:
    end_fraction: 0.9
  soft_quota:
    enabled: true
    min_frac: 0.05
    max_frac: 0.10
    per_event_cap_frac: 0.2
    score_temp_coeff: 0.2
    score_kl_scale: 0.5
  force_distill:
    min_frac: 0.05
    max_frac: 0.10
  disable_uncertainty_mask: true
  bootstrap_fraction: 0.08

training:
  epochs: 20
  batch_size: 24
  log_every: 50
  max_steps_per_epoch: null
  allow_data_parallel: true

scheduler:
  type: cosine
  warmup_steps: 800

teacher:
  use_ema: true
  ema_decay: 0.998

logging:
  output_dir: paper_results/weibo_dynamic_distill
  run_name: weibo_dynamic_distill_force
  overwrite: true

tokenizer:
  name: bert-base-chinese
  max_length: 160
  local_files_only: false

vision_processor:
  name: google/vit-base-patch16-224-in21k
  image_size: 224
  local_files_only: false

data:
  type: weibo
  root: datasets/weibo
  num_workers: 8
  pin_memory: true
  train:
    id_file: train_id.pickle
    text_sources:
      - path: tweets/train_rumor.txt
        label: 1
      - path: tweets/train_nonrumor.txt
        label: 0
      - path: tweets/test_rumor.txt
        label: 1
      - path: tweets/test_nonrumor.txt
        label: 0
  val:
    id_file: validate_id.pickle
    text_sources:
      - path: tweets/train_rumor.txt
        label: 1
      - path: tweets/train_nonrumor.txt
        label: 0
      - path: tweets/test_rumor.txt
        label: 1
      - path: tweets/test_nonrumor.txt
        label: 0
  test:
    id_file: test_id.pickle
    text_sources:
      - path: tweets/test_rumor.txt
        label: 1
      - path: tweets/test_nonrumor.txt
        label: 0
      - path: tweets/train_rumor.txt
        label: 1
      - path: tweets/train_nonrumor.txt
        label: 0
