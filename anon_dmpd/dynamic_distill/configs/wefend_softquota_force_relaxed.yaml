model:
  num_classes: 2
  encoder_dim: 768
  classifier_hidden: 512
  dropout: 0.1
  text_model: bert-base-chinese
  vision_model: google/vit-base-patch16-224-in21k
optim:
  lr: 1.55e-05
  weight_decay: 0.01
loss:
  alpha: 0.6
  beta: 0.32
  gamma: 1.2
  evidence_anneal_steps: 2000
  class_weights:
    - 0.635
    - 2.4597

distillation:
  temperature: 2.32
  delta: 0.06
  lambda_kl: 1.0
  lambda_feat: 0.1
  warmup_steps: 320
  start_fraction: 0.15
  end_fraction: 0.70
  adaptive_temperature:
    enabled: true
    base: 2.32
    coeff: 1.0
  confidence_gate:
    enabled: false
    margin: 0.0
  uncertainty_ema:
    enabled: true
    momentum: 0.9
  lambda_fusion_to_text: 0.12
  lambda_fusion_to_vision: 0.12
  fusion_confidence: 0.12
  require_student_mistake: false
  agreement_confidence_gap: 0.0
  positive_distill_boost: 1.5
  positive_student_conf_margin: 0.8
  positive_stage_start_fraction: 0.35
  positive_stage_boost: 2.0
  positive_stage_conf_margin: 0.9
  positive_event_gate:
    enabled: true
    min_size: 1
    teacher_conf: 0.9
    student_conf: 0.7
    only: false
  event_filter:
    min_size: 1
    teacher_min_acc: 0.7
    teacher_min_conf: 0.8
    warmup_steps: 3
  fusion_teacher_must_match: false
  delta_schedule:
    end_fraction: 0.8
  soft_quota:
    enabled: true
    min_frac: 0.05
    max_frac: 0.12
    per_event_cap_frac: 0.2
    score_temp_coeff: 0.2
    score_kl_scale: 0.6
  force_distill:
    min_frac: 0.08
    max_frac: 0.15
  disable_uncertainty_mask: true
  bootstrap_fraction: 0.1
training:
  epochs: 20
  batch_size: 32
  log_every: 50
  max_steps_per_epoch: 240
  allow_data_parallel: true
  early_stopping_patience: 8
scheduler:
  type: cosine
  warmup_steps: 720
teacher:
  use_ema: true
  ema_decay: 0.998
  teacher_config: dynamic_distill/configs/wefend_uncertainty_fusion_v2.yaml
  teacher_checkpoint: paper_results/wefend_uncertainty_fusion_v2/wefend_uncertainty_fusion_v2_seed00/model_best.pt
logging:
  output_dir: paper_results/wefend_dynamic_distill_teacher_wcls_selective_v2
  run_name: wefend_softquota_force_relaxed
  overwrite: true
tokenizer:
  name: bert-base-chinese
  max_length: 160
  local_files_only: false
  word_dropout: 0.1
vision_processor:
  name: google/vit-base-patch16-224-in21k
  image_size: 224
  local_files_only: false
  augment:
    enabled: true
    flip_prob: 0.5
    color_jitter: 0.2
    random_rescale: 0.1
data:
  type: wefend
  root: datasets/wechat
  num_workers: 8
  pin_memory: true
  train:
    csv_file: processed_split/wefend_train.csv
    image_dir: images
  val:
    csv_file: processed_split/wefend_val.csv
    image_dir: images
  test:
    csv_file: processed_split/wefend_test.csv
    image_dir: images
notes:
  strategy_name: wefend_softquota_force_relaxed
