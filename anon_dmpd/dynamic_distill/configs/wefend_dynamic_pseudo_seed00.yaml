model:
  num_classes: 2
  encoder_dim: 768
  classifier_hidden: 512
  dropout: 0.1
  text_model: bert-base-chinese
  vision_model: google/vit-base-patch16-224-in21k
optim:
  lr: 1.4e-05
  weight_decay: 0.01
loss:
  alpha: 0.6
  beta: 0.32
  gamma: 1.2
  evidence_anneal_steps: 2200
  class_weights:
    - 0.635
    - 2.3597
distillation:
  temperature: 2.3
  delta: 0.05
  lambda_kl: 1.1
  lambda_feat: 0.1
  warmup_steps: 300
  start_fraction: 0.18
  end_fraction: 0.62
  adaptive_temperature:
    enabled: true
    base: 2.3
    coeff: 1.6
  confidence_gate:
    enabled: true
    margin: 0.12
  uncertainty_ema:
    enabled: true
    momentum: 0.9
  positive_distill_boost: 1.6
  positive_student_conf_margin: 0.9
  positive_stage_start_fraction: 0.5
  positive_stage_boost: 2.0
  positive_stage_conf_margin: 0.95
  positive_event_gate:
    enabled: true
    min_size: 2
    teacher_conf: 0.9
    student_conf: 0.8
  event_filter:
    min_size: 1
    teacher_min_acc: 0.8
    teacher_min_conf: 0.85
    warmup_steps: 3
  soft_quota:
    enabled: true
    min_frac: 0.08
    max_frac: 0.15
    per_event_cap_frac: 0.3
  force_distill:
    min_frac: 0.08
    max_frac: 0.12
training:
  epochs: 14
  batch_size: 32
  log_every: 50
  allow_data_parallel: true
  early_stopping_patience: 5
scheduler:
  type: cosine
  warmup_steps: 600
teacher:
  use_ema: true
  ema_decay: 0.998
  teacher_config: dynamic_distill/configs/wefend_uncertainty_fusion_v2.yaml
  teacher_checkpoint: paper_results/wefend_uncertainty_fusion_v2/wefend_uncertainty_fusion_v2_seed00/model_best.pt
logging:
  output_dir: paper_results/wefend_dynamic_pseudo
  run_name: wefend_dynamic_pseudo_seed00
  overwrite: true
tokenizer:
  name: bert-base-chinese
  max_length: 160
  word_dropout: 0.1
vision_processor:
  name: google/vit-base-patch16-224-in21k
  image_size: 224
  augment:
    enabled: true
    flip_prob: 0.5
    color_jitter: 0.2
    random_rescale: 0.1
data:
  type: wefend
  root: datasets/wechat
  num_workers: 8
  pin_memory: true
  train:
    csv_file: processed_split/wefend_train_with_pseudo.csv
    image_dir: images
  val:
    csv_file: processed_split/wefend_val.csv
    image_dir: images
  test:
    csv_file: processed_split/wefend_test.csv
    image_dir: images
