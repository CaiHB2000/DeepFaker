model:
  num_classes: 2
  encoder_dim: 768
  classifier_hidden: 512
  dropout: 0.1
  text_model: bert-base-chinese
  vision_model: google/vit-base-patch16-224-in21k
optim:
  lr: 1.5e-05
  weight_decay: 0.01
loss:
  alpha: 0.6
  beta: 0.32
  gamma: 1.15
  evidence_anneal_steps: 2200
  class_weights: [0.635, 2.3597]
distillation:
  temperature: 2.4
  delta: 0.06
  lambda_kl: 1.1
  lambda_feat: 0.1
  warmup_steps: 320
  start_fraction: 0.18
  end_fraction: 0.6
  adaptive_temperature:
    enabled: true
    base: 2.4
    coeff: 1.5
  confidence_gate:
    enabled: true
    margin: 0.12
  uncertainty_ema:
    enabled: true
    momentum: 0.9
  positive_distill_boost: 1.5
  positive_student_conf_margin: 0.9
  positive_stage_start_fraction: 0.48
  positive_stage_boost: 1.9
  positive_stage_conf_margin: 0.94
  positive_event_gate:
    enabled: true
    min_size: 2
    teacher_conf: 0.92
    student_conf: 0.82
  event_filter:
    min_size: 2
    teacher_min_acc: 0.85
    teacher_min_conf: 0.9
    warmup_steps: 4
  soft_quota:
    enabled: true
    min_frac: 0.08
    max_frac: 0.14
    per_event_cap_frac: 0.3
  force_distill:
    min_frac: 0.06
    max_frac: 0.1
  weak_teacher:
    enabled: true
    lambda: 0.5
    metric: acc
    min_seen: 2
    threshold: 0.85
    apply_positive: true
    apply_negative: false
    temperature: 2.2
    default_score: 0.9
    use_ema: true
    mix_ratio: 0.6
    event_ema_enabled: true
    event_mix: 0.5
    dynamic_scale:
      enabled: true
      min_score: 0.6
      max_score: 0.95
      power: 1.5
training:
  epochs: 14
  batch_size: 24
  log_every: 50
  allow_data_parallel: true
  early_stopping_patience: 4
scheduler:
  type: cosine
  warmup_steps: 600
teacher:
  use_ema: true
  ema_decay: 0.998
  teacher_config: dynamic_distill/configs/wefend_uncertainty_fusion_v2.yaml
  teacher_checkpoint: paper_results/wefend_uncertainty_fusion_v2/wefend_uncertainty_fusion_v2_seed00/model_best.pt
logging:
  output_dir: paper_results/wefend_dynamic_weakteacher
  run_name: wefend_dynamic_weakteacher_seed00_bs24
  overwrite: true
tokenizer:
  name: bert-base-chinese
  max_length: 160
  word_dropout: 0.1
vision_processor:
  name: google/vit-base-patch16-224-in21k
  image_size: 224
  augment:
    enabled: true
    flip_prob: 0.5
    color_jitter: 0.2
    random_rescale: 0.1
data:
  type: wefend
  root: datasets/wechat
  num_workers: 8
  pin_memory: true
  train:
    csv_file: processed_split/wefend_train.csv
    image_dir: images
  val:
    csv_file: processed_split/wefend_val.csv
    image_dir: images
  test:
    csv_file: processed_split/wefend_test.csv
    image_dir: images
