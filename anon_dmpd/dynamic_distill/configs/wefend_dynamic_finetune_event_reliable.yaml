model:
  num_classes: 2
  encoder_dim: 768
  classifier_hidden: 512
  dropout: 0.1
  text_model: bert-base-chinese
  vision_model: google/vit-base-patch16-224-in21k
  init_checkpoint: paper_results/wefend_dynamic_distill_teacher_wcls_selective_v2/wefend_dynamic_distill_teacher_wcls_event_reliable_seed00/model_best.pt

optim:
  lr: 6.0e-06
  weight_decay: 0.01

loss:
  alpha: 0.62
  beta: 0.34
  gamma: 0.0
  evidence_anneal_steps: 0
  class_weights:
    - 0.635
    - 2.3597

distillation:
  temperature: 2.0
  delta: 0.1
  lambda_kl: 0.0
  lambda_feat: 0.0
  warmup_steps: 0
  start_fraction: 0.0
  adaptive_temperature:
    enabled: false
  confidence_gate:
    enabled: false
  uncertainty_ema:
    enabled: false

training:
  epochs: 4
  batch_size: 32
  log_every: 40
  max_steps_per_epoch: 180
  allow_data_parallel: true
  early_stopping_patience: 2

scheduler:
  type: cosine
  warmup_steps: 80

logging:
  output_dir: paper_results/wefend_dynamic_distill_teacher_wcls_selective_v2
  run_name: wefend_dynamic_finetune_event_reliable
  overwrite: true

tokenizer:
  name: bert-base-chinese
  max_length: 160
  local_files_only: false

vision_processor:
  name: google/vit-base-patch16-224-in21k
  image_size: 224
  local_files_only: false

data:
  type: wefend
  root: datasets/wechat
  num_workers: 8
  pin_memory: true
  train:
    csv_file: processed_split/wefend_train.csv
    image_dir: images
  val:
    csv_file: processed_split/wefend_val.csv
    image_dir: images
  test:
    csv_file: processed_split/wefend_test.csv
    image_dir: images
