# Selector baseline (WeFEND): confidence-based selector（对标主模型的 selector，仅做对比）
model:
  num_classes: 2
  encoder_dim: 768
  classifier_hidden: 512
  dropout: 0.1
  text_model: bert-base-chinese
  vision_model: google/vit-base-patch16-224-in21k

optim:
  lr: 1.75e-05
  weight_decay: 0.01

loss:
  alpha: 0.62
  beta: 0.33
  gamma: 1.15
  evidence_anneal_steps: 2000
  class_weights: [0.635, 2.3597]

distillation:
  temperature: 2.4
  delta: 0.08
  lambda_kl: 1.1
  lambda_feat: 0.16
  warmup_steps: 480
  start_fraction: 0.32
  end_fraction: 0.8
  confidence_gate:
    enabled: true
    margin: 0.24
  uncertainty_ema:
    enabled: true
    momentum: 0.92
  fusion_teacher_must_match: true
  consensus_gate:
    enabled: true
    min_conf: 0.7
    require_agreement: true
  positive_event_gate:
    enabled: true
    min_size: 1
    teacher_conf: 0.7
    student_conf: 0.5
    only: false
  event_filter:
    min_size: 1
    teacher_min_acc: 0.6
    teacher_min_conf: 0.65
    warmup_steps: 5
  soft_quota:
    enabled: true
    min_frac: 0.05
    max_frac: 0.10
    per_event_cap_frac: 0.2
  force_distill:
    min_frac: 0.04
    max_frac: 0.10
  disable_uncertainty_mask: false
  bootstrap_fraction: 0.05

training:
  epochs: 12
  batch_size: 24
  log_every: 100
  max_steps_per_epoch: 360
  allow_data_parallel: true
  early_stopping_patience: 4

scheduler:
  type: cosine
  warmup_steps: 780

teacher:
  use_ema: true
  ema_decay: 0.998
  teacher_config: dynamic_distill/configs/wefend_uncertainty_fusion_v2.yaml
  teacher_checkpoint: paper_results/wefend_uncertainty_fusion_v2/wefend_uncertainty_fusion_v2_seed00/model_best.pt

logging:
  output_dir: paper_results/wefend_selector_ablation
  run_name: wefend_selector_confidence
  overwrite: true

tokenizer:
  name: bert-base-chinese
  max_length: 160
  local_files_only: false
  word_dropout: 0.1

vision_processor:
  name: google/vit-base-patch16-224-in21k
  image_size: 224
  local_files_only: false
  augment:
    enabled: true
    flip_prob: 0.5
    color_jitter: 0.2
    random_rescale: 0.1

data:
  type: wefend
  root: datasets/wechat
  num_workers: 8
  pin_memory: true
  train:
    csv_file: processed_split/wefend_train.csv
    image_dir: images
  val:
    csv_file: processed_split/wefend_val.csv
    image_dir: images
  test:
    csv_file: processed_split/wefend_test.csv
    image_dir: images
